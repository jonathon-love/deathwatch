title: Survival Analysis
name: surv
jus: '3.0'
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Time Elapsed
        children:
          - type: VariablesListBox
            name: elapsed
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Event
        children:
          - type: VariablesListBox
            name: event
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: eventLevel
      - type: TargetLayoutBox
        label: Group
        children:
          - type: VariablesListBox
            name: groups
            maxItemCount: 1
            isTarget: true
  - type: Label
    name: tests
    label: Tests of Equality
    stretchFactor: 1
    children:
      - name: tests_logrank
        type: CheckBox
        optionName: tests
        optionPart: logrank
        enable: (groups)
      - name: tests_gehan
        type: CheckBox
        optionName: tests
        optionPart: gehan
        enable: (groups)
      - name: tests_taroneware
        type: CheckBox
        optionName: tests
        optionPart: taroneware
        enable: (groups)
      - name: tests_petopeto
        type: CheckBox
        optionName: tests
        optionPart: petopeto
        enable: (groups)
      - type: CheckBox
        name: testspw
        enable: (groups)
  - type: Label
    label: Plots
    stretchFactor: 1
    cell:
      row: 1
      column: 1
    children:
      - type: CheckBox
        name: sc
        children:
          - type: CheckBox
            name: ci
            enable: (sc)
          - type: CheckBox
            name: cens
            enable: (sc)
          - type: CheckBox
            name: risk
            enable: (sc)
          - type: CheckBox
            name: median
            enable: (sc)
      - type: CheckBox
        name: chf
        children:
          - type: CheckBox
            name: logscale
            enable: (chf)
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: units
            format: string
            enable: (sc || chf)
